map $uri $auth_client {
    default "";
    ~^/api/v1/auth/(login|register)/?$ $binary_remote_addr;
}
limit_req_zone $auth_client zone=auth_requests:1m rate=20r/m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location ~ ^/(login|register|dashboard|projects|kanban|backlog|members|settings)/?$ {
        add_header X-Robots-Tag "noindex" always;
        try_files /app.html =404;
    }

    location = /app.html {
        internal;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        client_max_body_size 11m;
        limit_req zone=auth_requests burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
