services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
  postgres:
    image: postgres:16-alpine
    container_name: rusttrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rusttrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/migrations/20240101000000_init_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rusttrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: rusttrack-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      SERVER_HOST: 0.0.0.0
      KANBRIX_WEBHOOK_DESTINATIONS: ${KANBRIX_WEBHOOK_DESTINATIONS:-}
      REDIS_URL: redis://redis:6379/
      SERVER_PORT: 8080
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/rusttrack
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - api_uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        SITE_URL: ${SITE_URL:-}
    container_name: rusttrack-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data:
  api_uploads:
