version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rusttrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rusttrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rusttrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: rusttrack-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      CLIENT_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/rusttrack
      SESSION_SECRET: replace_with_a_secure_random_string_in_production
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - api_uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: rusttrack-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
  api_uploads:
