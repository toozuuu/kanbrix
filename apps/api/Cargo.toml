[package]
name = "rusttrack-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "1.0"
sha2 = "0.10"
utoipa = { version = "6", features = ["chrono", "uuid", "axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
utoipa-axum = { version = "0.3" }
axum-extra = { version = "0.9", features = ["cookie"] }

reqwest = { version = "0.12", features = ["json", "cookies"] }
redis = { version = "0.27", features = ["tokio-comp"] }
