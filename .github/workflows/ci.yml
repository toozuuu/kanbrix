name: Kanbrix CI

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/rusttrack_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rusttrack_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check Formatting
        working-directory: apps/api
        run: cargo fmt -- --check

      - name: Prepare PostgreSQL for SQLx
        run: |
          for migration in apps/api/migrations/*.sql; do
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run Clippy
        working-directory: apps/api
        run: cargo clippy --locked -- -D warnings

      - name: Verify database constraints and compare representative query plans
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/seed.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/test-scope.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/test-configuration.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/test-report.sql
          for size in 100 1000 10000; do
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v size="$size" -f scripts/benchmark.sql
          done

      - name: Run Tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/rusttrack_test
          APP_ENV: test
        run: cargo test --locked --verbose

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Run component tests
        working-directory: apps/web
        run: npm test

      - name: Typecheck & Build
        working-directory: apps/web
        run: npm run build

  compose:
    name: Compose startup and database recovery
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: kanbrix
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Compose images with layer caching
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-compose.yml
          targets: api,web
          load: true
          set: |
            api.tags=kanbrix-api:latest
            api.cache-from=type=gha,scope=kanbrix-ci-api
            api.cache-to=type=gha,scope=kanbrix-ci-api,mode=max,ignore-error=true
            web.tags=kanbrix-web:latest
            web.cache-from=type=gha,scope=kanbrix-ci-web
            web.cache-to=type=gha,scope=kanbrix-ci-web,mode=max,ignore-error=true
      - run: docker compose up -d --no-build
      - name: Verify public page and API readiness
        run: |
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8080/ready
          curl --fail http://localhost:5173/ | grep -q 'Release board'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/api/v1/auth/me)" = 401
      - name: Regenerate client from the running API and typecheck consumers
        working-directory: apps/web
        run: |
          npm ci
          npm run generate:api
          npm run lint
      - name: Exercise attachments, live updates, reports and workspace search
        working-directory: apps/web
        run: RECOVERY_FIXTURE="$RUNNER_TEMP/recovery.json" node scripts/test-collaboration.mjs
      - name: Verify metadata cache is populated
        run: test "$(docker compose exec -T redis redis-cli DBSIZE)" -gt 0
      - name: Verify signed-in dashboard and responsive settings
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-tests"
          "$RUNNER_TEMP/browser-tests/bin/pip" install playwright
          "$RUNNER_TEMP/browser-tests/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/browser-tests/bin/python" scripts/test-dashboard-browser.py
      - name: Verify sprint lifecycle through the API
        run: python3 scripts/test-sprint.py
      - name: Verify organization configuration through the API
        run: python3 scripts/test-configuration.py
      - name: Restore a snapshot into a separate database and compare data
        run: |
          docker compose exec -T postgres pg_dump -U postgres -Fc rusttrack > "$RUNNER_TEMP/kanbrix.dump"
          docker compose exec -T postgres createdb -U postgres recovery
          docker compose exec -T postgres pg_restore -U postgres --exit-on-error -d recovery < "$RUNNER_TEMP/kanbrix.dump"
          for db in rusttrack recovery; do
            docker compose exec -T postgres psql -U postgres -d "$db" -Atc "SELECT id, project_id, issue_number, title FROM issues ORDER BY id" > "$RUNNER_TEMP/$db.rows"
          done
          test -s "$RUNNER_TEMP/rusttrack.rows"
          diff "$RUNNER_TEMP/rusttrack.rows" "$RUNNER_TEMP/recovery.rows"
      - name: Recover uploads and verify an authenticated download on a fresh API
        run: |
          docker compose exec -T api tar -C /app/uploads -cf - . > "$RUNNER_TEMP/uploads.tar"
          docker volume create recovery_uploads
          docker run --rm -i -v recovery_uploads:/restore alpine tar -C /restore -xf - < "$RUNNER_TEMP/uploads.tar"
          docker compose run --no-deps -d --name recovery-api -p 127.0.0.1:8081:8080 -v recovery_uploads:/app/uploads -e DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/recovery api
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8081/ready
          base=http://localhost:8081/api/v1
          fixture="$RUNNER_TEMP/recovery.json"
          jq -c '.credentials | {email,password}' "$fixture" | curl -fsS -c "$RUNNER_TEMP/cookies" -H 'Content-Type: application/json' --data-binary @- "$base/auth/login" >/dev/null
          issue=$(jq -r .issue "$fixture")
          attachment=$(jq -r .attachment "$fixture")
          curl -fsS -b "$RUNNER_TEMP/cookies" "$base/issues/$issue" | jq -e '.title == "Release issue"'
          curl -fsS -b "$RUNNER_TEMP/cookies" "$base/issues/$issue/attachments/$attachment" > "$RUNNER_TEMP/recovered.txt"
          printf 'release notes' | cmp - "$RUNNER_TEMP/recovered.txt"
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - if: success() || failure()
        run: |
          cargo install cargo-audit --locked
          cargo audit
